// ── Global live subscription: show external inputs (voice sensors, service
//    calls) and their replies in real time, without requiring a page refresh ──
let _globalSubClose = null;
let _globalLastInput = '';
let _globalLastResp = '';
// True while sendMessage() is awaiting the API (panel's own input already
// renders its own user bubble, so the global handler must not duplicate it)
let _sendingFromPanel = false;

function startGlobalSubscription() {
  // Tear down any previous subscription (e.g. when switching instances)
  if (_globalSubClose) { try { _globalSubClose(); } catch(e) {} _globalSubClose = null; }
  _globalLastInput = '';
  _globalLastResp = '';

  const respSensor = getInstanceSensor('last_response');
  const inputSensor = getInstanceSensor('last_input');

  _globalSubClose = subscribeEntities([respSensor, inputSensor], (entityId, state) => {
    try {
      const text = (state.state || '').trim();
      if (!text || text === 'unavailable' || text === 'unknown') return;

      if (entityId === inputSensor) {
        // External user input (voice sensor, service call from elsewhere)
        if (text !== _globalLastInput && !_sendingFromPanel) {
          _globalLastInput = text;
          hideLoad();
          addMsg('user', text);
        }
      } else if (entityId === respSensor) {
        const ip = state.attributes.in_progress !== false;
        // Only show completed replies (and avoid re-showing while the panel
        // itself is sending — sendMessage renders its own bubble)
        if (!ip && text !== _globalLastResp && !_sendingFromPanel) {
          _globalLastResp = text;
          hideLoad();
          const existing = document.getElementById('progMsg');
          if (existing) {
            const tp = existing.querySelector('.msg-text');
            if (tp) tp.textContent = text;
            existing.id = '';
          } else {
            addMsg('assistant', text);
          }
          setStatus(t('connected'));
        }
      }
    } catch(e) {}
  });
}

// Main send
async function sendMessage(fromVoice) {
  const input = document.getElementById('inputField');
  const btn = document.getElementById('sendBtn');
  const text = input.value.trim();
  if (!text || loading) return;
  input.value = '';
  loading = true; btn.disabled = true;

  // Clear progressive message marker from previous conversation
  const oldProg = document.getElementById('progMsg');
  if (oldProg) oldProg.id = '';

  addMsg('user', text);
  // Track this input in the global handler's dedup vars so the live
  // subscription doesn't re-render it when the last_input sensor updates.
  _globalLastInput = text;
  showLoad();
  setStatus(t('thinkingText'));
  _sendingFromPanel = true;

  try {
    const inst = currentInstanceId;
    const body = inst ? { text, entry_id: inst } : { text };
    if (fromVoice) body.source = 'voice';

    // Wait a beat for any previous WS cleanup, then subscribe
    await new Promise(r => setTimeout(r, 100));

    let lastTts = '', totalActs = 0, finalRounds = 1, gotResult = false;

    const handleState = (state) => {
      if (gotResult) return;
      const ip = state.attributes.in_progress !== false;
      const round = state.attributes.round || 0;
      const tts = state.state;

      if (ip && round > 0) setStatus(t('reasoningPrefix') + round + t('reasoningSuffix'));

      if (tts && tts !== lastTts) {
        lastTts = tts;
        // Keep the global dedup var in sync so the live subscription skips
        // intermediate TTS updates too (not just the final one).
        _globalLastResp = tts;

        // Browser TTS for voice input from chat
        if (fromVoice && window.speechSynthesis) {
          window.speechSynthesis.cancel();
          const utter = new SpeechSynthesisUtterance(tts);
          utter.lang = lang;
          window.speechSynthesis.speak(utter);
        }

        try {
          const fr = state.attributes.full_response;
          if (fr) {
            const p = JSON.parse(fr);
            lastDebugRaw = JSON.stringify(p, null, 2);
            totalActs = (p.steps || []).filter(x => x.action === 'call_service').length;
          }
        } catch(e) {}
        hideLoad();
        const existing = document.getElementById('progMsg');
        if (existing) {
          const tp = existing.querySelector('.msg-text');
          if (tp) tp.textContent = tts;
        } else {
          hideLoad(); showLoad(); hideLoad();
          addMsg('assistant', tts, lastDebugRaw);
          const m = document.querySelector('.msg.assistant:last-child');
          if (m) m.id = 'progMsg';
        }
      }

      if (!ip) {
        gotResult = true;
        finalRounds = round || 1;
        if (!lastTts && tts) lastTts = tts;
        // Sync the global dedup var so the live subscription doesn't
        // re-render this reply as a duplicate after _sendingFromPanel
        // resets (race between HTTP 200 and the WS event for this state).
        _globalLastResp = lastTts;
        hideLoad();
        const doneProg = document.getElementById('progMsg');
        if (doneProg) doneProg.id = '';
        setStatus(finalRounds + ' ' + t('round') + ', ' + totalActs + ' ' + t('actions'));
      }
    };

    // Subscribe FIRST so we don't miss state changes
    // Subscribe FIRST so we don't miss state changes
    const closeSub = subscribeEntity(getInstanceSensor('last_response'), handleState);

    // Small delay to let WS connect, THEN call the API
    await new Promise(r => setTimeout(r, 300));
    await callAPI('POST', '/api/services/llm_smart_assistant/process_input', body);
  } catch(e) {
    hideLoad();
    setStatus(e.message, false);
  }

  loading = false;
  btn.disabled = false;
  // Delay resetting _sendingFromPanel so the global subscription's WS
  // callback for the final last_response state (which may arrive shortly
  // after the HTTP 200) still sees the flag as true and skips the duplicate.
  // The dedup vars (_globalLastInput/_globalLastResp) are the primary guard;
  // this delay is a belt-and-suspenders against event ordering races.
  setTimeout(() => { _sendingFromPanel = false; }, 500);
}

// Apply i18n to all elements with data-i18n attribute
function applyI18n() {
  document.querySelectorAll('[data-i18n]').forEach(el => {
    const key = el.dataset.i18n;
    const val = t(key);
    if (val === undefined || val === key) return;
    if (el.tagName === 'INPUT' || el.tagName === 'TEXTAREA') {
      if (el.type === 'text' || !el.type) {
        el.placeholder = val;
      }
    } else {
      el.textContent = val;
    }
  });
}

// Init
(async function init() {
  // 1. Use the configured access token (injected by ChatPanelView backend)
  try {
    if (window.CONFIGURED_ACCESS_TOKEN) {
      accessToken = window.CONFIGURED_ACCESS_TOKEN;
    }
  } catch(e) {}

  // 2. Try auth_token from URL query parameter (passed by chat.js wrapper)
  try {
    const params = new URLSearchParams(window.location.search);
    const urlToken = params.get('auth_token');
    if (!accessToken && urlToken) {
      accessToken = urlToken;
      window.history.replaceState({}, document.title, window.location.pathname);
    }
  } catch(e) {}
  
  // 3. Try reading token from HA session storage (same-origin, shared with parent)
  if (!accessToken) {
    try {
      // HA stores tokens in localStorage under 'hassTokens'
      const stored = localStorage.getItem('hassTokens');
      if (stored) {
        const parsed = JSON.parse(stored);
        if (parsed.access_token) accessToken = parsed.access_token;
      }
    } catch(e) {}
  }
  
  // 4. Request token from parent via postMessage (sent by chat.js)
  if (!accessToken) {
    try {
      window.parent.postMessage('__llm_auth_request__', '*');
      const token = await new Promise((resolve) => {
        const handler = (event) => {
          if (event.data && event.data.type === '__llm_auth_token__') {
            window.removeEventListener('message', handler);
            resolve(event.data.token);
          }
        };
        window.addEventListener('message', handler);
        setTimeout(() => resolve(''), 1500);
      });
      if (token) accessToken = token;
    } catch(e) {}
  }
  
  // 5. Try token from HA websocket connection (when in main window)
  try {
    if (!accessToken) {
      const wsToken = window.hassConnection?.auth?.data?.access_token;
      if (wsToken) accessToken = wsToken;
    }
  } catch(e) {}
  
  // 6. Try our own localStorage
  try {
    if (!accessToken) {
      const stored = localStorage.getItem('llm_assistant_token');
      if (stored) accessToken = stored;
    }
  } catch(e) {}
  
  if (accessToken) {
    document.getElementById('statusText').textContent = t('connected');
    document.getElementById('shareBtn').title = t('copyLink');
    discoverInstances();
    loadSuggestions();
    initSwipe();
    initHistory();
    // Live updates for external inputs (voice sensors, service calls)
    setTimeout(() => startGlobalSubscription(), 800);
    return;
  }
  
  // 7. Fallback: prompt for token
  accessToken = window.prompt(t('tokenPromptText')) || '';
  if (accessToken) {
    try { localStorage.setItem('llm_assistant_token', accessToken); } catch(e) {}
    document.getElementById('statusText').textContent = t('connected');
    discoverInstances();
    loadSuggestions();
    initSwipe();
    initHistory();
    setTimeout(() => startGlobalSubscription(), 800);
  } else {
    document.getElementById('statusText').textContent = t('noToken');
    setStatus(t('tokenRequired'), false);
  }
})();
</script>
