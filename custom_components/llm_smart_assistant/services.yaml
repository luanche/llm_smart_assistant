# Services for LLM Smart Assistant

process_input:
  name: Process Input
  description: "Manually send text input to the LLM assistant for processing."
  fields:
    text:
      name: Text
      description: "The input text to process."
      required: true
      example: "Turn on the living room lights"
      selector:
        text:
    entry_id:
      name: Config Entry ID
      description: "Target a specific LLM instance. Leave empty to process on all instances."
      required: false
      selector:
        text:

create_automation:
  name: Create Automation
  description: "Create a dynamic automation rule via LLM. Supports multiple triggers with AND/OR logic and one-shot (auto-remove) behavior."
  fields:
    entity_id:
      name: Entity ID
      description: "The entity to monitor for state changes (legacy single-trigger form)."
      required: false
      example: "sensor.temperature"
      selector:
        entity:
          domain: sensor
    condition:
      name: Condition
      description: "Condition to trigger the automation (e.g., '>30', '==on', '<5')."
      required: false
      example: ">30"
      selector:
        text:
    triggers:
      name: Triggers
      description: "List of triggers: [{'entity_id': ..., 'condition': ...}] or [{'type': 'time', 'time': '21:00'}]. Overrides entity_id/condition when provided."
      required: false
      selector:
        object:
    trigger_logic:
      name: Trigger Logic
      description: "Simple AND/OR mode for multiple triggers: 'and' (all must match) or 'or' (any matches). Ignored when expression is provided."
      required: false
      default: "or"
      selector:
        select:
          options:
            - "or"
            - "and"
    expression:
      name: Trigger Expression
      description: "Advanced boolean expression combining triggers by index, e.g. '(0 and 1) or 2'. Supports AND, OR and parentheses."
      required: false
      example: "(0 and 1) or 2"
      selector:
        text:
    one_shot:
      name: One Shot
      description: "If true, the automation fires once and then removes itself (good for time-based rules)."
      required: false
      default: false
      selector:
        boolean:
    prompt:
      name: Automation Prompt
      description: "The prompt template used for LLM context when automation triggers."
      required: false
      selector:
        text:
          multiline: true
    description:
      name: Description
      description: "A human-readable description of this automation."
      required: false
      example: "Turn on AC when temperature exceeds 30 degrees"
      selector:
        text:

remove_automation:
  name: Remove Automation
  description: "Remove a dynamically created automation."
  fields:
    automation_id:
      name: Automation ID
      description: "The ID of the automation to remove."
      required: true
      example: "a1b2c3d4-..."
      selector:
        text:

get_automations:
  name: Get Automations
  description: "List all currently registered dynamic automations."

update_automation:
  name: Update Automation
  description: "Update an existing dynamic automation. Listeners are re-registered when triggers, logic, entity_id or condition change."
  fields:
    automation_id:
      name: Automation ID
      description: "The ID of the automation to update."
      required: true
      example: "a1b2c3d4-..."
      selector:
        text:
    entity_id:
      name: Entity ID
      description: "New trigger entity (updates the first trigger). Re-registers the state-change listener."
      required: false
      example: "sensor.temperature"
      selector:
        entity:
          domain: sensor
    condition:
      name: Condition
      description: "New trigger condition (e.g., '>30', '==on', '<5')."
      required: false
      example: ">30"
      selector:
        text:
    triggers:
      name: Triggers
      description: "Full replacement list of triggers: [{'entity_id': ..., 'condition': ...}] or time triggers. Overrides entity_id/condition when provided."
      required: false
      selector:
        object:
    trigger_logic:
      name: Trigger Logic
      description: "Simple AND/OR mode: 'and' or 'or'. Ignored when expression is provided."
      required: false
      selector:
        select:
          options:
            - "or"
            - "and"
    expression:
      name: Trigger Expression
      description: "Advanced boolean expression combining triggers by index, e.g. '(0 and 1) or 2'. Supports AND, OR and parentheses."
      required: false
      selector:
        text:
    one_shot:
      name: One Shot
      description: "If true, the automation fires once then removes itself."
      required: false
      selector:
        boolean:
    prompt:
      name: Automation Prompt
      description: "New prompt template used for LLM context when the automation triggers."
      required: false
      selector:
        text:
          multiline: true
    description:
      name: Description
      description: "New human-readable description of this automation."
      required: false
      example: "Turn on AC when temperature exceeds 30 degrees"
      selector:
        text:

toggle_automation:
  name: Toggle Automation
  description: "Enable or disable a dynamic automation. Disabling removes its state-change listener; enabling re-registers it."
  fields:
    automation_id:
      name: Automation ID
      description: "The ID of the automation to toggle."
      required: true
      example: "a1b2c3d4-..."
      selector:
        text:
    disable:
      name: Disable
      description: "Set to true to disable the automation, false to enable it."
      required: false
      default: true
      selector:
        boolean:
    entry_id:
      name: Config Entry ID
      description: "Target a specific LLM instance. Leave empty to search all instances."
      required: false
      selector:
        text:

chat:
  name: Chat
  description: "Send a message to the LLM and get a response. Returns tts_text, steps, and raw JSON."
  fields:
    text:
      name: Text
      description: "The message to send to the AI assistant."
      required: true
      example: "你好！请打开客厅灯"
      selector:
        text:
